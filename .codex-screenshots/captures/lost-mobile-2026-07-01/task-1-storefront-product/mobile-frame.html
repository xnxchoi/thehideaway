<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LOST Mobile Audit Frame</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }

      body {
        display: grid;
        place-items: start;
      }

      #mobile-frame {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <iframe
      id="mobile-frame"
      title="LOSTINSEOUL mobile audit viewport"
      src="http://localhost:3000/lostinseoul"
    ></iframe>
    <script>
      const params = new URLSearchParams(window.location.search);
      const target = params.get("target");
      const scrollY = Number.parseInt(params.get("scrollY") ?? "0", 10);
      const frame = document.getElementById("mobile-frame");
      if (target) {
        const url = new URL(target, "http://localhost:3000");
        frame.src = url.href;
      }
      frame.addEventListener("load", () => {
        if (!Number.isFinite(scrollY) || scrollY <= 0) return;
        window.setTimeout(() => {
          try {
            frame.contentWindow.scrollTo(0, scrollY);
          } catch {
            // The public audit frame is same-origin; this local copy documents behavior.
          }
        }, 750);
      });
    </script>
  </body>
</html>
