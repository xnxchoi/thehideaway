services:
  payload:
    restart: always
    container_name: payload
    image: node:latest
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    ports:
      - "3000:3000"
    build:
      context: ./
      dockerfile: dev.Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        COOKIE_DOMAIN: ${COOKIE_DOMAIN}
        NEXT_PUBLIC_IMAGE_MAX_FILE_SIZE: ${NEXT_PUBLIC_IMAGE_MAX_FILE_SIZE}
        NEXT_PUBLIC_VIDEO_MAX_FILE_SIZE: ${NEXT_PUBLIC_VIDEO_MAX_FILE_SIZE}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL}
        NEXT_PUBLIC_EXCHANGE_RATE_URL: ${NEXT_PUBLIC_EXCHANGE_RATE_URL}
        NEXT_PUBLIC_HOLIDAY_API_URL: ${NEXT_PUBLIC_HOLIDAY_API_URL}
        AUTH_NAVER_SECRET: ${AUTH_NAVER_SECRET}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        AUTH_ADMINS_GOOGLE_ID: ${AUTH_ADMINS_GOOGLE_ID}
        AUTH_ADMINS_GOOGLE_SECRET: ${AUTH_ADMINS_GOOGLE_SECRET}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        EXCHANGE_RATE_KEY: ${EXCHANGE_RATE_KEY}
        HOLIDAY_API_KEY: ${HOLIDAY_API_KEY}
        DATABASE_URI: postgresql://postgres:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}
    env_file:
      - .env
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hideaway
  nginx:
    restart: always
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/sites-enabled/default.conf:/etc/nginx/sites-enabled/default.conf
      - ./nginx/logs:/var/log/nginx
    ports:
      - "80:80"
    depends_on:
      - payload
    networks:
     - hideaway


  # Ensure your DATABASE_URI uses 'postgresql' as the hostname ie. postgresql://127.0.0.1:5432/your-database-name
  postgres:
    restart: always
    container_name: postgres
    build:
      context: ./postgres
      dockerfile: dev.Dockerfile
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    hostname: 'postgresql'
    # Reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from .env via
    # compose interpolation. Defaults match the historical local-dev values so
    # a fresh clone with an empty .env still starts.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-H1dden!}
      TZ: Asia/Seoul
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-theestate} # THIS MUST MATCH YOUR DB NAME IN .env
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - hideaway
volumes:
  pgdata:
  node_modules:
networks:
  hideaway:
    external: true
