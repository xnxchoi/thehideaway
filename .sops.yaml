# .sops.yaml — encryption rules for sops.
#
# When you run `sops <file>`, sops consults this config to decide how to
# encrypt a NEW file (existing encrypted files store their recipients inline
# in the file itself; this only governs first-encryption / `sops updatekeys`).
#
# The age public key below is safe to commit. The matching age private key
# lives at:
#   - ~/.config/sops/age/keys.txt (mode 600) on the laptop
#   - /etc/age/keys.txt (mode 600, owner root) on the VPS
#   - Apple Passwords (recovery backup)
#   - GitHub Actions secret SOPS_AGE_KEY (for CI decrypts)
#
# To rotate the recipient (e.g. add a new dev's key, retire the old):
#   1. Generate / collect the new public key.
#   2. Edit this file and bump the `age:` field.
#   3. Run: sops updatekeys .env.production.enc
#      (re-encrypts in place to the new recipient set; doesn't touch values).
#   4. Commit and deploy.

creation_rules:
  # All encrypted env files in the project root or any subdirectory.
  - path_regex: \.env\..*\.enc$
    # `dotenv` format = encrypt VALUES only, leave KEYS in cleartext so git
    # diffs stay reviewable.
    input_type: dotenv
    output_type: dotenv
    age: age12l5tk45zu4ppdted4clpetx04kajlshp5vrqxs2r3fer9htkhyaqnqg4vc
