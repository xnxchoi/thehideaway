  # Ensure your DATABASE_URI uses 'postgresql' as the hostname ie. postgresql://127.0.0.1:5432/your-database-name
  postgres:
    restart: always
    container_name: postgres
    image: postgres:18beta2-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    hostname: postgresql
    environment:
      POSTGRES_PASSWORD: H1dden!
      POSTGRES_USER: postgres
      TZ: Asia/Seoul
      POSTGRES_DB: theestate # THIS MUST MATCH YOUR DB NAME IN .env
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - hideaway
volumes:
  pgdata:
  node_modules:
networks:
  hideaway:
    external: true
