name: theestate
services:
  payload:
    container_name: payload
    volumes:
      - node_modules:/home/node/app/node_modules
    # No external port exposure - only accessible via Docker network
    env_file:
      - .env.production
    environment:
      # Override database connection for Docker network
      DATABASE_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    build:
      context: ./
      dockerfile: prod.Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL}
        - NEXT_PUBLIC_IMAGE_MAX_FILE_SIZE=${NEXT_PUBLIC_IMAGE_MAX_FILE_SIZE}
        - NEXT_PUBLIC_VIDEO_MAX_FILE_SIZE=${NEXT_PUBLIC_VIDEO_MAX_FILE_SIZE}
        - NEXT_PUBLIC_BETTER_AUTH_URL=${NEXT_PUBLIC_BETTER_AUTH_URL}
        - NEXT_PUBLIC_EXCHANGE_RATE_URL=${NEXT_PUBLIC_EXCHANGE_RATE_URL}
        - NEXT_PUBLIC_HOLIDAY_API_URL=${NEXT_PUBLIC_HOLIDAY_API_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hideaway

  nginx:
    restart: always
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/sites-enabled/production.conf:/etc/nginx/sites-enabled/default.conf
      - ./nginx/logs:/var/log/nginx
      # Mount Let's Encrypt certificates from host
      - /etc/letsencrypt/live/hideawayseoul.com/fullchain.pem:/etc/nginx/certs/hideawayseoul.com/hideawayseoul.com.pem:ro
      - /etc/letsencrypt/live/hideawayseoul.com/privkey.pem:/etc/nginx/certs/hideawayseoul.com/hideawayseoul.com-key.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - payload
    networks:
      - hideaway

  postgres:
    restart: always
    container_name: postgres
    image: postgres:18rc1-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - hideaway
volumes:
  pgdata:
  node_modules:
networks:
  hideaway:
    external: true
