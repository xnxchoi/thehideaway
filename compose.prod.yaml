# compose.prod.yaml
#
# Production deployment for hideawayseoul.com
# VPS: ITEASY EasyCloud — 2 vCPU / 4 GB RAM / 100 GB HDD (Seoul)
#
# ── DEPLOY FLOW ──────────────────────────────────────────────────────────────
#
#  LAPTOP:
#    pnpm release:cut 1.2.3        — gates + tag + push; CI builds and pushes
#                                    pack + migrate images to ghcr.io.
#
#  VPS:
#    ./scripts/deploy.sh v1.2.3    — pull from ghcr.io + rotate + smoke test
#    ./scripts/deploy.sh v1.2.3 --migrate
#                                  — same + pg_dump backup + migrations
#
# ── MIGRATION NOTES ──────────────────────────────────────────────────────────
#
#  Migrations are intentionally NOT automatic on startup. Run them explicitly:
#
#    # 1. Back up first (always, even for schema-only changes):
#    docker compose exec postgres pg_dump \
#      -U postgres -Fc ${POSTGRES_DB} > backup-$(date +%Y%m%d-%H%M%S).dump
#
#    # 2. Run migrations:
#    docker compose -f compose.prod.yaml --profile migrate \
#      run --rm migrate
#
#  PG MAJOR VERSION UPGRADES (e.g. 18 → 19):
#    Cannot swap the image tag with live data. Requires pg_dump + pg_restore.
#    See scripts/pg-upgrade.sh for the full procedure.
#
# ─────────────────────────────────────────────────────────────────────────────

name: theestate

services:

  # ── Application ─────────────────────────────────────────────────────────────
  payload:
    container_name: payload
    image: ${REGISTRY:-hideaway}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HOSTNAME: "::"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    volumes:
      # ── Payload runtime upload dirs ─────────────────────────────────────────
      # Named volumes — start empty, Payload writes into them as content is
      # uploaded via /vault. Persist across deploys and container restarts.
      - payload_media:/app/public/media
      - payload_track_media:/app/public/track_media
      - payload_users:/app/public/users
      - payload_assets_media:/app/public/assets/media

      # ── Large 3D static assets ───────────────────────────────────────────────
      # Bind mounts to host filesystem — excluded from the Docker image (~432 MB).
      # The host dirs must be populated once (see .dockerignore bootstrap comment).
      # Set ASSETS_HOST_PATH in .env.production to override /opt/thehideaway/assets.
      - ${ASSETS_HOST_PATH:-/opt/thehideaway/assets}/plate:/app/public/assets/plate:ro
      - ${ASSETS_HOST_PATH:-/opt/thehideaway/assets}/rp_plaque:/app/public/assets/rp_plaque:ro
      - ${ASSETS_HOST_PATH:-/opt/thehideaway/assets}/three:/app/public/assets/three:ro
    deploy:
      resources:
        limits:
          # 4 GB VPS budget: payload 1.5g + postgres 1g + nginx 128m = 2.6 GB
          # committed, leaving ~1.4 GB for OS + Docker overhead + page cache.
          # Next.js standalone + Payload typically sits at 700–900 MB RSS, so
          # 1.5 GB is roughly 2× steady-state headroom.
          memory: 1500m
          cpus: "1.5"
    networks:
      - hideaway

  # ── Migration runner (one-shot, explicit) ────────────────────────────────────
  # Only active when --profile migrate is passed. Never runs automatically.
  # Always take a pg_dump backup before running this.
  migrate:
    container_name: hideaway-migrate
    image: ${REGISTRY:-hideaway}-migrate:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - hideaway
    profiles:
      - migrate

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    container_name: nginx
    restart: unless-stopped
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      # Override the built-in site config (same path → volume shadows the COPY)
      - ./nginx/sites-enabled/production.conf:/etc/nginx/sites-enabled/production.conf
      - ./nginx/logs:/var/log/nginx
      # Let's Encrypt certs — managed by certbot on the host
      - /etc/letsencrypt/live/hideawayseoul.com/fullchain.pem:/etc/nginx/certs/hideawayseoul.com/hideawayseoul.com.pem:ro
      - /etc/letsencrypt/live/hideawayseoul.com/privkey.pem:/etc/nginx/certs/hideawayseoul.com/hideawayseoul.com-key.pem:ro
      # Certbot ACME webroot challenge directory
      # On host: certbot certonly --webroot -w /var/www/certbot -d hideawayseoul.com
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      payload:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # nginx as a reverse-proxy + static-file server is overprovisioned
          # at 256m on this stack. 128m is comfortable for the traffic ranges
          # a 4 GB / 2-vCPU VPS can serve.
          memory: 128m
          cpus: "0.5"
    networks:
      - hideaway

  # ── PostgreSQL 18 ─────────────────────────────────────────────────────────────
  # PG 18 required: native uuidv7() function used throughout the schema.
  # DO NOT downgrade — UUID v7 generation would break.
  #
  # Tuned for the budget Postgres actually gets (1 GB container cap below).
  # Headroom = container_limit − shared_buffers − worst_case_work_mem_pool.
  #   shared_buffers       = 384 MB  (~37% of container; conventional 25% rule
  #                                   from bare-metal docs doesn't apply when
  #                                   OS page cache shares the same limit)
  #   effective_cache_size = 512 MB  (planner hint; honest about what page cache
  #                                   is available INSIDE the 1 GB container.
  #                                   1 GB would mislead the planner toward
  #                                   warm-cache index plans on cold HDD data)
  #   work_mem             = 12 MB   (per-sort/hash; max_connections × work_mem
  #                                   = 360 MB worst case + shared_buffers
  #                                   = 744 MB, leaves ~280 MB for backends +
  #                                   WAL + OS overhead inside the 1 GB limit)
  #   maintenance_work_mem = 128 MB
  #   max_connections      = 30      (app pool capped at 15 in payload.config.ts;
  #                                   PG reserves 3 for superusers, so the
  #                                   effective non-super limit is 27. Headroom
  #                                   = 12 for migrate/backup/psql/Dockge)
  #   random_page_cost     = 4       (HDD; for SSD use 1.1–1.5 for NVMe, 2.0
  #                                   for network-attached SSD. Never set to 1.0)
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      # PG18+ Docker images store data in a major-version subdirectory and
      # require the mount at /var/lib/postgresql (NOT .../data). Mounting the
      # old path makes the entrypoint abort before initdb. See
      # https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
    env_file:
      - .env.production
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      # Authenticated probe: pg_isready only confirms the socket is open; this
      # also verifies pg_hba.conf accepts the credentials AND the target DB
      # exists. Catches the (rare) case where the cluster is up but auth or
      # initdb left things in a bad state. PGPASSWORD lives in argv inside the
      # container only — same trust boundary as POSTGRES_PASSWORD itself.
      test:
        - "CMD-SHELL"
        - "PGPASSWORD=$$POSTGRES_PASSWORD psql -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB} -tAc 'SELECT 1' >/dev/null"
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=384MB
      -c effective_cache_size=512MB
      -c work_mem=12MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=4
      -c max_connections=30
      -c log_min_duration_statement=1000
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: "1"
    networks:
      - hideaway

  # ── Dockge — compose-stack admin GUI ─────────────────────────────────────────
  # Why Dockge over Portainer: compose-first (reads/writes our existing
  # compose.prod.yaml directly), MIT-licensed, lightweight (~30 MB RAM vs
  # Portainer's ~80 MB — meaningful headroom on a 4 GB box).
  #
  # SECURITY: bound to 127.0.0.1 only. No public exposure. Access via:
  #   ssh -N -L 5001:127.0.0.1:5001 deploy@<host>
  # Then http://localhost:5001 on your laptop.
  #
  # Authentication is handled by Dockge itself (set up on first visit). The
  # SSH tunnel is the network-layer auth; Dockge's username/password is the
  # app-layer auth. Two layers because Dockge has root-equivalent power on
  # this host (it can start/stop any container, mutate any compose stack).
  #
  # On first deploy, this profile is opt-in. To enable:
  #   docker compose -f compose.prod.yaml --profile admin up -d dockge
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      # Tell Dockge where to find the compose stacks it manages.
      # /opt/stacks is its working dir; we mount /home/deploy as the stacks dir
      # so Dockge can edit our actual compose.prod.yaml in place.
      DOCKGE_STACKS_DIR: /opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge_data:/app/data
      # Read-write mount of the deploy dir so Dockge can edit compose.prod.yaml.
      # Scoped to /home/deploy/ rather than the whole host fs.
      - /home/deploy:/opt/stacks
    networks:
      - hideaway
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    profiles:
      - admin

volumes:
  pgdata:
  # Payload CMS upload volumes — persist user-uploaded content across deploys.
  # Back these up via scripts/backup.sh (or a separate volume backup job) before
  # any major infra change. On first deploy Docker creates them empty; Payload
  # writes into them as files are uploaded through /vault.
  payload_media:
  payload_track_media:
  payload_users:
  payload_assets_media:
  # Dockge persists user/session/audit data here. Empty on first run; you'll
  # set up the admin account on first visit.
  dockge_data:

networks:
  hideaway:
    external: true
