# ── Caching ──────────────────────────────────────────────────────────────────
proxy_cache_path /var/cache/nginx
    levels=1:2
    keys_zone=STATIC:10m
    inactive=7d
    use_temp_path=off;

# ── Rate limiting zones ───────────────────────────────────────────────────────
# auth_limit  — login / register / password-reset endpoints (very strict)
# api_limit   — all other /api/* routes
# page_limit  — regular page navigation
# Zones live at http context because this file is included inside http {}.
limit_req_zone  $binary_remote_addr  zone=auth_limit:10m    rate=10r/m;
limit_req_zone  $binary_remote_addr  zone=api_limit:10m     rate=60r/m;
limit_req_zone  $binary_remote_addr  zone=page_limit:20m    rate=300r/m;
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

# ── Cloudflare real IP restoration ───────────────────────────────────────────
include /etc/nginx/cloudflare.conf;

# ── Upstream ─────────────────────────────────────────────────────────────────
upstream hideaway_upstream {
    server payload:3000;
    keepalive 16;
}

# ── HTTP — certbot challenge + redirect to canonical HTTPS ───────────────────
server {
    listen 80 default_server;
    server_name hideawayseoul.com www.hideawayseoul.com;

    # Let's Encrypt / Certbot ACME webroot challenge
    # certbot certonly --webroot -w /var/www/certbot -d hideawayseoul.com
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hideawayseoul.com$request_uri;
    }
}

# ── www → canonical HTTPS redirect ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.hideawayseoul.com;

    ssl_certificate     /etc/nginx/certs/hideawayseoul.com/hideawayseoul.com.pem;
    ssl_certificate_key /etc/nginx/certs/hideawayseoul.com/hideawayseoul.com-key.pem;
    include /etc/nginx/ssl.conf;

    return 301 https://hideawayseoul.com$request_uri;
}

# ── Primary HTTPS server ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    server_name hideawayseoul.com;

    ssl_certificate     /etc/nginx/certs/hideawayseoul.com/hideawayseoul.com.pem;
    ssl_certificate_key /etc/nginx/certs/hideawayseoul.com/hideawayseoul.com-key.pem;
    include /etc/nginx/ssl.conf;

    # ── Request sizing ───────────────────────────────────────────────────────
    # 25 MB covers profile photos and post hero images; Payload enforces
    # its own per-upload limits on top of this.
    client_max_body_size  25m;
    client_body_timeout   30s;
    client_header_timeout 10s;

    # ── Connection cap (per IP, all locations) ───────────────────────────────
    limit_conn conn_limit 40;

    # ── Backend timeouts ─────────────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    send_timeout          60s;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_proxied  any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        text/plain
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # ── Common proxy headers (inherited by all location blocks) ──────────────
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # ── Static assets — cached, no rate limit ────────────────────────────────
    location /_next/static {
        proxy_cache STATIC;
        proxy_pass http://hideaway_upstream;
    }

    location /static {
        proxy_cache STATIC;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 60m;
        proxy_pass http://hideaway_upstream;
    }

    # ── SSE notification stream ───────────────────────────────────────────────
    # Each open tab holds one long-lived TCP connection.  Buffering must be
    # disabled end-to-end or events will be held in nginx's buffer until the
    # connection closes — defeating the purpose of SSE.
    location /api/notifications/stream {
        proxy_pass         http://hideaway_upstream;

        # Disable all buffering so chunks reach the browser immediately
        proxy_buffering    off;
        proxy_cache        off;

        # Hold the connection open for up to one hour; Cloudflare Free/Pro
        # closes idle connections at ~100 s, so the client reconnects
        # automatically via the EventSource reconnect mechanism.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # SSE uses plain HTTP/1.1 keep-alive, not the Upgrade/WebSocket flow
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Signal Cloudflare (and any intermediate proxy) not to buffer
        add_header X-Accel-Buffering no always;

        # Per-IP SSE connection cap — one open stream per tab; allow a few tabs
        limit_conn conn_limit 5;
    }

    # ── Auth endpoints — very strict rate limit ───────────────────────────────
    # 10 req/min with burst 5: allows a quick login retry but blocks brute-force
    location /api/auth/ {
        limit_req        zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://hideaway_upstream;
    }

    # ── Admin panel — same strict auth limit ─────────────────────────────────
    location /vault/ {
        limit_req        zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://hideaway_upstream;
    }

    # ── All other API routes ──────────────────────────────────────────────────
    # 60 req/min covers normal client-side data fetching (React Query, etc.)
    location /api/ {
        limit_req        zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://hideaway_upstream;
    }

    # ── Page routes ───────────────────────────────────────────────────────────
    # 300 req/min (5 req/s) is generous for an editorial reader but still
    # blocks naive scrapers and runaway crawlers.
    location / {
        limit_req        zone=page_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://hideaway_upstream;
    }
}
