proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;

# Include Cloudflare real IP configuration
include /etc/nginx/cloudflare.conf;

upstream hideaway_upstream {
  server payload:3000;
}

# HTTP server - redirect to HTTPS
server {
  listen 80 default_server;
  
  server_name hideawayseoul.com www.hideawayseoul.com;
  
  # Redirect all HTTP traffic to HTTPS
  return 301 https://$server_name$request_uri;
}

# HTTPS server for production
server {
  listen 443 ssl http2 default_server;
  
  server_name hideawayseoul.com www.hideawayseoul.com;
  
  # SSL Configuration
  ssl_certificate /etc/nginx/certs/hideawayseoul.com/hideawayseoul.com.pem;
  ssl_certificate_key /etc/nginx/certs/hideawayseoul.com/hideawayseoul.com-key.pem;
  
  # Include SSL settings
  include /etc/nginx/ssl.conf;

  gzip on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_types text/css application/javascript image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_cache_bypass $http_upgrade;

  location /_next/static {
    proxy_cache STATIC;
    proxy_pass http://hideaway_upstream;

    # For testing cache - remove before deploying to production
    add_header X-Cache-Status $upstream_cache_status;
  }

  location /static {
    proxy_cache STATIC;
    proxy_ignore_headers Cache-Control;
    proxy_cache_valid 60m;
    proxy_pass http://hideaway_upstream;

    # For testing cache - remove before deploying to production
    add_header X-Cache-Status $upstream_cache_status;
  }

  location / {
    proxy_pass http://hideaway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    # Required for rate limiting
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
