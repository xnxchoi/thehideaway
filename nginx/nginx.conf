user nginx;
worker_processes auto;
worker_rlimit_nofile 65536;  # must be >= worker_connections * worker_processes
pid /run/nginx.pid;
daemon off;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # Hide Nginx version in headers and error pages
    server_tokens off;

    # Hide the upstream's X-Powered-By header. Built-in directive — the
    # third-party headers-more module is intentionally not used. `server_tokens
    # off` above hides the nginx version; the bare `Server: nginx` remains.
    proxy_hide_header X-Powered-By;

    # $uri excludes query strings. Keep sensitive order lookups private even
    # on nginx-generated errors; leave the general policy unchanged.
    # This map belongs at http scope, unlike headers.conf (also used by SSL servers).
    map $uri $response_referrer_policy {
        default "no-referrer-when-downgrade";
        /api/lost/orders "no-referrer";
        /api/lost/orders/ "no-referrer";
    }

    # Security and cache-control headers (defined in headers.conf)
    include /etc/nginx/headers.conf;

    # Standard defaults
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Reduce log noise from expected rate-limit bursts
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # Allow long domain names
    # Prevents: "could not build server_names_hash, you should increase
    #            server_names_hash_bucket_size: 64"
    server_names_hash_bucket_size 128;

    # Sites (included inside http context so they can define limit_req_zone,
    # proxy_cache_path, and upstream blocks at the correct scope level)
    include /etc/nginx/sites-enabled/*;
}
