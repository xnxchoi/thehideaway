# Required to use `more_clear_headers`
load_module modules/ngx_http_headers_more_filter_module.so;

user www-data;
worker_processes auto;
worker_rlimit_nofile 65536;  # must be >= worker_connections * worker_processes
pid /run/nginx.pid;
daemon off;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # Hide Nginx version in headers and error pages
    server_tokens off;

    # Strip server identification headers
    more_clear_headers Server;
    more_clear_headers X-Powered-By;

    # Security and cache-control headers (defined in headers.conf)
    include /etc/nginx/headers.conf;

    # Standard defaults
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Reduce log noise from expected rate-limit bursts
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # Allow long domain names
    # Prevents: "could not build server_names_hash, you should increase
    #            server_names_hash_bucket_size: 64"
    server_names_hash_bucket_size 128;

    # Sites (included inside http context so they can define limit_req_zone,
    # proxy_cache_path, and upstream blocks at the correct scope level)
    include /etc/nginx/sites-enabled/*;
}
