packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@clerk/shared'
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - browser-tabs-lock
  - core-js
  - esbuild
  - sharp
  - unrs-resolver

publicHoistPattern:
  - '*eslint*'
